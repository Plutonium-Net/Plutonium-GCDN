<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Binding of Isaac</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #flash-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      overflow: hidden;
    }
    .black-box {
      position: fixed;
      background: black;
      z-index: 10;
    }
    #box-top    { top: 0;    left: 0;  width: 100%; height: 0; }
    #box-bottom { bottom: 0; left: 0;  width: 100%; height: 0; }
    #box-left   { top: 0;    left: 0;  width: 0;    height: 100%; }
    #box-right  { top: 0;    right: 0; width: 0;    height: 100%; }
    ruffle-player {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>

  <!-- The save. This is a Flash build - one SWF, played by Ruffle - so its save is
       a SharedObject, and Ruffle keeps SharedObjects in localStorage. Swapping the
       area before Ruffle initialises is the whole conversion (STORAGE.md sections
       11 and 14).

       installSharedObjects is the Ruffle-shaped version of that swap: Ruffle names
       a slot after the movie's own URL - "<host>/games/the-binding-of-isaac/
       BiWrath.swf/<name>" - so the host the page was opened from would otherwise be
       part of the save's name. Naming the movie narrows that to
       "BiWrath.swf/<name>".

       This has to come before `ruffle.min.js`, because the player reads a movie's
       save as it loads it. -->
  <script src="../../js/plustore.js"></script>
  <script>
    PluStore.configure({ game: 'the-binding-of-isaac' });
    var storage = PluStore.installSharedObjects('BiWrath.swf');
    if (!storage) {
      console.error('The Binding of Isaac: window.localStorage could not be swapped - ' +
        'the save would go to the browser store instead of the document');
    }

    /* The movie carries no outbound request of its own - there is no URL string in
       it at all, no ad preloader and no portal SDK - so there is nothing to refuse.
       This guard is belt and braces: the page must not be able to leave the
       machine, whoever edits the movie or the player later. Ruffle fetches through
       `window.fetch`, and that one call is the whole surface. */
    (function () {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      var here = location.protocol + '//' + location.host;
      var refused = [];

      function local(url) {
        try {
          var u = new URL(url, here);
          if (u.protocol === 'data:' || u.protocol === 'blob:') return true;
          return u.protocol + '//' + u.host === here;
        } catch (e) {
          return false;
        }
      }

      var realFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (local(url)) return realFetch.apply(this, arguments);
        if (refused.indexOf(url) < 0) {
          refused.push(url);
          console.warn('The Binding of Isaac: refused a request outside this folder: ' + url);
        }
        return Promise.reject(new TypeError('The Binding of Isaac: only this folder is reachable (' + url + ')'));
      };
    })();
  </script>

  <!-- Ruffle, vendored from the release the other Flash pages use
       (@ruffle-rs/ruffle 0.2.0-nightly.2025.10.2, MIT / Apache-2.0, both licences
       beside it) with the core glue and the wasm it fetches from this folder at run
       time. The published page took ruffle.min.js from jsDelivr and carried the
       save off through js/sync.js; neither is here any more.

       Both core pairs are kept, and both are needed: ruffle.min.js probes
       WebAssembly.validate() for SIMD and four other extensions, and loads
       core.ruffle.ae105... + f7f28e....wasm when all five are present, falling back
       to core.ruffle.9085... + 4d8824....wasm otherwise. -->
  <script src="ruffle/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <div class="black-box" id="box-top"></div>
  <div class="black-box" id="box-bottom"></div>
  <div class="black-box" id="box-left"></div>
  <div class="black-box" id="box-right"></div>
  <script>
    const container = document.getElementById('flash-container');
    const boxTop = document.getElementById('box-top');
    const boxBottom = document.getElementById('box-bottom');
    const boxLeft = document.getElementById('box-left');
    const boxRight = document.getElementById('box-right');

    /* The movie's own stage, read out of the SWF header: 800x600, so 4/3. The
       published page used the wrapper's 5.5/3 and stretched it. */
    const aspectRatio = 4 / 3;

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      let width = Math.floor(windowWidth * 1);
      let height = Math.floor(width / aspectRatio);

      if (height > windowHeight * 1) {
        height = Math.floor(windowHeight * 1);
        width = Math.floor(height * aspectRatio);
      }

      container.style.width = `${width}px`;
      container.style.height = `${height}px`;

      const topMargin = (windowHeight - height) / 2;
      const leftMargin = (windowWidth - width) / 2;

      boxTop.style.height = `${topMargin}px`;
      boxBottom.style.height = `${topMargin}px`;
      boxLeft.style.width = `${leftMargin}px`;
      boxRight.style.width = `${leftMargin}px`;
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('DOMContentLoaded', () => {
      resizeGame();
      const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
      if (ruffle && container) {
        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.background = 'black';
        container.appendChild(player);
        /* The published page called player.load("$1"). Its wrapper was never
           filled in, so Ruffle was handed a four-character string where a movie
           belongs and nothing ever started. */
        player.load('BiWrath.swf');
      } else {
        container.textContent = 'Ruffle failed to load.';
      }
    });
  </script>
</body>
</html>
