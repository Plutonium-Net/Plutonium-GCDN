<!DOCTYPE html>
<!-- Pluto Game 9/11/2026 -->
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Granny Original</title>

  <!-- The save. Granny's is PlayerPrefs in the player's own /idbfs, which the
       patched glue hands to PluStore instead of IndexedDB — see
       ../../STORAGE.md, section 6. -->
  <script src="../../js/plustore.js"></script>
  <script>PluStore.configure({ game: 'granny', mount: '/idbfs' });</script>

  <!-- The build calls three Yandex SDK imports of its own, from inside the
       compiled glue, so something has to answer `YaGames` before the player
       runs. This is that something, and it explains what the real SDK does
       here. -->
  <script src="yandex-sdk-local.js"></script>

  <!-- The old storage method is gone, and so is the CDN. This page used to be a
       wrapper: every path below pointed at a jsDelivr folder, js/sync.js
       carried the save off to a server, `sdk.js` loaded the real Yandex SDK
       from that CDN, and a second injected script fetched GameMonetize's
       `sedk.js` — a file that does not exist in its own repository (jsDelivr
       answers "Couldn't find the requested file"). Nothing here leaves the
       machine now. -->
  <link rel="stylesheet" href="TemplateData/style.css">

  <script>
    /* Nothing on this page belongs off the machine, so nothing is allowed off
       it. This is a Unity 2021 build, and a player of that era carries its own
       telemetry: the compiled player reports to Unity's analytics endpoints
       from inside the wasm image, where it cannot be edited out. A refused
       request looks to the player exactly like an offline one, which is what a
       local copy is. Relative and same-origin URLs are the whole game — the
       build, its parts, the merged blob URLs, the streaming audio — so those
       pass. */
    (function () {
      function allowed(url) {
        var text = String(url === undefined || url === null ? '' : url);
        if (!text) return true;                       /* relative to this page */
        if (text.indexOf('blob:') === 0 || text.indexOf('data:') === 0) return true;
        if (text[0] === '/' || text[0] === '.') return true;
        try { return new URL(text, location.href).origin === location.origin; }
        catch (e) { return false; }
      }
      function refuse(what, url) {
        console.info('Granny: refusing ' + what + ' to ' + url +
          ' — this copy is local, so requests off the machine are refused.');
        return new TypeError('blocked by the local-only guard: ' + url);
      }

      var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (method, url) {
        this.pluBlocked = allowed(url);
        this.pluUrl = url;
        return open.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function () {
        if (this.pluBlocked === false) {
          refuse('a request', this.pluUrl);
          try { this.abort(); } catch (e) {}
          this.dispatchEvent(new Event('error'));
          return;
        }
        return send.apply(this, arguments);
      };

      if (window.fetch) {
        var realFetch = window.fetch;
        window.fetch = function (input) {
          var url = typeof input === 'string' ? input : (input && input.url);
          if (!allowed(url)) return Promise.reject(refuse('a fetch', url));
          return realFetch.apply(this, arguments);
        };
      }

      if (navigator.sendBeacon) {
        var beacon = navigator.sendBeacon.bind(navigator);
        navigator.sendBeacon = function (url, data) {
          if (!allowed(url)) { refuse('a beacon', url); return false; }
          return beacon(url, data);
        };
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
    }
    #unity-container {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
    }
    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #ffffff;
      border-radius: 10px;
      display: block;
    }
    #unity-logo {
      position: absolute;
      top: calc(50% - 100px);
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: auto;
    }
    #unity-logo img {
      max-width: 100%;
      height: auto;
    }
    #unity-progress-bar-empty {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #unity-progress-bar-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background: #4caf50;
      border-radius: 8px;
      transition: width 0.3s ease;
    }
    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translate(-50%);
      background: white;
      padding: 10px;
      display: none;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" style="position: absolute; width: 100%; height: 100%"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo">
        <img src="logo.png" alt="">
      </div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    /* The build ships its data and its wasm split in two parts each, and Unity's
       loader asks for each of them under a name that does not exist on disk —
       `Granny.data`, `Granny.wasm`. This is the wrapper's own scheme, kept as
       it was: merge the parts into one buffer, hand the loader a blob URL, and
       move the progress bar while doing it. Only the URLs under it changed,
       from the CDN to this folder. */
    async function mergeUnityWebFiles(baseUrl, filePrefix, totalParts, extension) {
      const partUrls = [];
      for (let i = 1; i <= totalParts; i++) {
        partUrls.push(`${baseUrl}/${filePrefix}_part${i}.${extension}`);
      }

      const buffers = [];
      for (let i = 0; i < totalParts; i++) {
        const response = await fetch(partUrls[i]);
        if (!response.ok) {
          throw new Error(`Failed to load part: ${partUrls[i]}`);
        }
        const buffer = await response.arrayBuffer();
        buffers.push(buffer);

        const progress = ((i + 1) / totalParts) * 100;
        document.querySelector("#unity-progress-bar-full").style.width = `${progress}%`;
      }

      const totalLength = buffers.reduce((acc, buffer) => acc + buffer.byteLength, 0);
      const combinedBuffer = new Uint8Array(totalLength);
      let offset = 0;

      buffers.forEach((buffer) => {
        combinedBuffer.set(new Uint8Array(buffer), offset);
        offset += buffer.byteLength;
      });

      return combinedBuffer;
    }

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    /* The glue sends its ad messages to this name, so it is the page that owns
       it. */
    let myGameInstance = null;

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Granny.loader.js";

    async function initializeGame() {
      try {
        const dataBuffer = await mergeUnityWebFiles(buildUrl, "Granny", 2, "data");
        const wasmBuffer = await mergeUnityWebFiles(buildUrl, "Granny", 2, "wasm");

        const dataBlobUrl = URL.createObjectURL(new Blob([dataBuffer], { type: "application/octet-stream" }));
        const wasmBlobUrl = URL.createObjectURL(new Blob([wasmBuffer], { type: "application/octet-stream" }));

        var config = {
          dataUrl: dataBlobUrl,
          frameworkUrl: buildUrl + "/Granny.framework.js",
          codeUrl: wasmBlobUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Anastasia Kazantseva",
          productName: "Granny",
          productVersion: "1.0",
          showBanner: unityShowBanner,
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            myGameInstance = unityInstance;
            loadingBar.style.display = "none";
          }).catch((message) => {
            alert(message);
          });
        };

        document.body.appendChild(script);
      } catch (error) {
        console.error("Game initialization failed:", error);
      }
    }

    initializeGame();
  </script>
</body>
</html>
