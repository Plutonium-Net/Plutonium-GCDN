<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Big Tower Tiny Square 2</title>
  <link rel="stylesheet" href="style.css" type="text/css">

  <style type="text/css">
    #button {
      display: none;
    }
    .imgb_vis {
      animation: imgb-animation 7s linear;
    }
    @keyframes imgb-animation {
      10% { transform: translateX(0); }
      20% { transform: translateX(100px); }
      90% { transform: translateX(100px); }
      100% { transform: translateX(0); }
    }
  </style>

  <script src="../../js/plustore.js"></script>
  <script>PluStore.configure({ game: 'big-tower-tiny-square-2' });</script>
  <script type="module" src="c3runtime.js"></script>
</head>
<body>
  <script src="box2d.wasm.js"></script>
  <script>
    window.addEventListener("keydown", function (e) {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
      }
    }, false);
  </script>
  <noscript>
    <div id="notSupportedWrap">
      <h2 id="notSupportedTitle">This content requires JavaScript</h2>
      <p class="notSupportedMessage">JavaScript appears to be disabled. Please enable it to view this content.</p>
    </div>
  </noscript>
  <script src="supportcheck.js"></script>
  <script src="main.js" type="module"></script>
</body>
</html>
