<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Learn to Fly</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #flash-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      overflow: hidden;
    }
    .black-box {
      position: fixed;
      background: black;
      z-index: 10;
    }
    #box-top    { top: 0;    left: 0;  width: 100%; height: 0; }
    #box-bottom { bottom: 0; left: 0;  width: 100%; height: 0; }
    #box-left   { top: 0;    left: 0;  width: 0;    height: 100%; }
    #box-right  { top: 0;    right: 0; width: 0;    height: 100%; }
    ruffle-player {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>

  <!-- The save. Ruffle keeps every Flash save - a SharedObject - in localStorage:
       its wasm carries a `ruffle_web::storage::LocalStorageBackend` and reaches
       the browser through `window.localStorage`. Swapping the area before Ruffle
       initialises is therefore the whole conversion, the same shape as any other
       Web Storage engine (STORAGE.md section 11, and section 14 for this one).

       This movie's storage is read off its own constant pool: one object, asked
       for as SharedObject.getLocal("learntofly") and held in `var_so` - AS2, so
       its fields are written as properties of `var_so.data`. Ruffle names the
       slot after the movie's own URL,
       "127.0.0.1/games/learn-to-fly/learn-to-fly.swf/learntofly", so the host the
       page was opened from would otherwise be part of the save's name. Naming the
       movie narrows that to "learn-to-fly.swf/learntofly".

       This has to come before `ruffle.min.js`, because the player reads a movie's
       save as it loads it. -->
  <script src="../../js/plustore.js"></script>
  <script>
    PluStore.configure({ game: 'learn-to-fly' });
    var storage = PluStore.installSharedObjects('learn-to-fly.swf');
    if (!storage) {
      console.error('Learn to Fly: window.localStorage could not be swapped - ' +
        'the save would go to the browser store instead of the document');
    }

    /* Nothing on this page may leave the machine, and this movie asks for
       nothing: its pool holds one outbound URL, http://www.maxgames.com, and that
       is a sponsor button's getURL(..., "_blank") - a navigation if it is
       clicked, never a fetch by the player. The embedded font's comment
       ("Made by MillaN http://millan.pp.se/fonts/") is metadata inside a font,
       not a load. So this guard should never fire here; it is present because it
       costs nothing and a movie is a binary that can always surprise you. Ruffle
       fetches through `window.fetch` and never through XMLHttpRequest, so that
       one call is the whole surface. */
    (function () {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      var here = location.protocol + '//' + location.host;
      var refused = [];

      function local(url) {
        try {
          var u = new URL(url, here);
          if (u.protocol === 'data:' || u.protocol === 'blob:') return true;
          return u.protocol + '//' + u.host === here;
        } catch (e) {
          return false;
        }
      }

      var realFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (local(url)) return realFetch.apply(this, arguments);
        if (refused.indexOf(url) < 0) {
          refused.push(url);
          console.warn('Learn to Fly: refused a request outside this folder: ' + url);
        }
        return Promise.reject(new TypeError('Learn to Fly: only this folder is reachable (' + url + ')'));
      };
    })();
  </script>

  <!-- Ruffle, vendored from the release this page already pinned
       (@ruffle-rs/ruffle 0.2.0-nightly.2025.10.2, MIT / Apache-2.0, both licences
       beside it) with the core glue and the wasm it fetches from this folder at
       run time. The published page took ruffle.min.js from jsDelivr and carried
       the save off through js/sync.js; neither is here any more.

       Both core pairs are kept, and both are needed: ruffle.min.js probes
       WebAssembly.validate() for SIMD and four other extensions and loads
       core.ruffle.ae105... + f7f28e....wasm when all five are present, falling
       back to core.ruffle.9085... + 4d8824....wasm otherwise ("falling back to
       the vanilla WebAssembly module"). A browser without SIMD is 13 MB of unused
       files; a browser without the pair it needs has no player at all. -->
  <script src="ruffle/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <div class="black-box" id="box-top"></div>
  <div class="black-box" id="box-bottom"></div>
  <div class="black-box" id="box-left"></div>
  <div class="black-box" id="box-right"></div>
  <script>
    const container = document.getElementById('flash-container');
    const boxTop = document.getElementById('box-top');
    const boxBottom = document.getElementById('box-bottom');
    const boxLeft = document.getElementById('box-left');
    const boxRight = document.getElementById('box-right');

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspectRatio = 5.5 / 3;

      let width = Math.floor(windowWidth * 1);
      let height = Math.floor(width / aspectRatio);

      if (height > windowHeight * 1) {
        height = Math.floor(windowHeight * 1);
        width = Math.floor(height * aspectRatio);
      }

      container.style.width = `${width}px`;
      container.style.height = `${height}px`;

      const topMargin = (windowHeight - height) / 2;
      const leftMargin = (windowWidth - width) / 2;

      boxTop.style.height = `${topMargin}px`;
      boxBottom.style.height = `${topMargin}px`;
      boxLeft.style.width = `${leftMargin}px`;
      boxRight.style.width = `${leftMargin}px`;
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('DOMContentLoaded', () => {
      resizeGame();
      const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
      if (ruffle && container) {
        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.background = 'black';
        container.appendChild(player);
        /* The published page called player.load("$1"). Its wrapper was never
           filled in, so Ruffle was handed a four-character string where a movie
           belongs, and nothing ever started.

           The URL is absolute for the same reason Duck Life 3's is: Ruffle
           resolves whatever a movie asks for by name against the movie's own URL,
           and a bare relative path leaves it no base. This movie loads nothing of
           its own, so it is not load-bearing here - it is simply the movie's real
           URL. The save is unaffected either way: the key mapper strips
           everything before "<movie>.swf/". */
        player.load(new URL('learn-to-fly.swf', location.href).href);
      } else {
        container.textContent = 'Ruffle failed to load.';
      }
    });
  </script>
</body>
</html>
