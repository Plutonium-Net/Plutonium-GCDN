<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Drive Mad</title>
  <meta name="description" content="">
  <meta name="google" content="notranslate">

  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="stylesheet" href="webapp/fancade.css">
  <!-- The page used to <link rel="icon" href="webapp/favicon.ico"> and the host
       never had that file — a 404 on every load, upstream included. There is no
       icon to point at, so the link is gone rather than aimed at nothing. -->

  <!-- The save. Fancade's web player persists through its own `Storage` layer,
       which is localStorage: one base64 blob per path, keyed
       "com.martinmagni.drivemad/data/<path>", plus a bare "startup-time" flag.
       Swapping the area before the player loads is what puts all of it in the
       document — see js/plustore.js and STORAGE.md section 13.

       No `filePrefix` here, deliberately. Storage.sync() — the one call that
       hands the browser's stored files to the player at boot — walks
       localStorage.key(i) and skips every key that does not start with
       Storage.PREFIX:

         if (key === null || !key.startsWith(Storage.PREFIX)) continue;

       Stripping the prefix in the area hides every key from that loop, and the
       player is booted with no database at all: the game then reports that it
       could not load its progress, however healthy the document looks. So the
       area keeps the player's own key space, and the document is keyed by the
       same names the player looks for. -->
  <script src="../../js/plustore.js"></script>
  <script>
    PluStore.configure({ game: 'drive-mad' });
    var storage = PluStore.installWebStorage();
    if (!storage) {
      console.error('Drive Mad: window.localStorage could not be swapped — ' +
        'the save would go to the browser store instead of the document');
    }
  </script>

  <!-- The Poki SDK, which this build cannot start without, answered locally.
       poki-local.js explains what it replaces and why vendoring the published
       poki-sdk.js would have vendored a network call. -->
  <script src="poki-local.js"></script>
</head>

<body id="body">

  <!-- Modal dialog div -->
  <div id="modal_parent">
    <div id="modal_content">
      <span id="modal_close_button">&times;</span>
      <div id="store_link_modal_content" class="modal_inner"></div>
      <div id="share_file_modal_content" class="modal_inner"></div>
    </div>
  </div>

  <!--
      Game canvas and overlay. Emscripten makes some assumptions about how the canvas is positioned in order
      to translate document to game coordinates
    -->
  <div id="canvas_border" class="emscripten_border">
    <div id="play_content" class="middle center">
      <div class="edge">
        <div class="box">
          <div class="black">
            <img src="webapp/cover.jpg" class="cover">
            <p class="title">Drive Mad</p>
            <p class="author">Fancade</p>
          </div>
        </div>
      </div>
      <div id="progress_or_play">
        <progress id="progress" class="loading" value="0" max="100"></progress>
      </div>
      <p class="description"></p>
    </div>
    <canvas class="emscripten" id="canvas" tabindex=-1>
    </canvas>
    <div id="gradient"></div>
    <div id="webview_content"></div>
  </div>

  <!-- Manual JS, Called from WASM -->
  <script type="text/javascript" src="webapp/source_min.js"></script>

  <!-- Auto generated JS -->
  <script type="text/javascript" src="webapp/index.js"></script>
</body>

</html>
