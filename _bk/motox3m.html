<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
  <link rel="stylesheet" href="assets/css/app.css" type="text/css" />
  <title>Moto X3M</title>

  <!-- The save. This game is Phaser with `phaser-super-storage`, whose adapter
       is `localStorage` (it falls back to cookies only when localStorage is
       missing), so it is a Web Storage game and the area swap of STORAGE.md
       section 11 is the whole conversion. The plugin's `t.STORAGE_KEY` is
       "mx3msf2_gm", so its keys reach the document as @file blocks the same way
       any other localStorage key does.

       This has to load before `min.js`, because the plugin picks its adapter
       when the game boots, not on the first save. -->
  <script src="../../js/plustore.js"></script>
  <script>
    PluStore.configure({ game: 'motox3m' });
    var storage = PluStore.installWebStorage();
    if (!storage) {
      console.error('Moto X3M: window.localStorage could not be swapped - the save ' +
        'would go to the browser store instead of the document');
    }

    /* Nothing on this page may leave the machine. The published page pulled the
       game from a GameMonetize host and loaded its ad SDK (st39/sdk) plus the
       Google IMA SDK from jsDelivr; all of that is gone, but the game's own
       loader can still be handed an absolute URL. Phaser fetches through
       XMLHttpRequest and, for images, `Image.src`, so both are refused. Same
       origin, `data:` and `blob:` pass; anything else is rejected once per URL
       with a warning. */
    (function () {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      var here = location.protocol + '//' + location.host;
      var refused = [];

      function local(url) {
        try {
          var u = new URL(url, here);
          if (u.protocol === 'data:' || u.protocol === 'blob:') return true;
          return u.protocol + '//' + u.host === here;
        } catch (e) {
          return false;
        }
      }
      function note(url) {
        if (refused.indexOf(url) < 0) {
          refused.push(url);
          console.warn('Moto X3M: refused a request outside this folder: ' + url);
        }
      }

      var realFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (local(url)) return realFetch.apply(this, arguments);
        note(url);
        return Promise.reject(new TypeError('Moto X3M: only this folder is reachable (' + url + ')'));
      };

      var open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        if (!local(url)) {
          note(url);
          throw new TypeError('Moto X3M: only this folder is reachable (' + url + ')');
        }
        return open.apply(this, arguments);
      };
    })();
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
    }
    #content {
      width: 100vw;
      height: 100vh;
    }
    @media (min-width: 992px) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #content {
        width: 75vw;
      }
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <div id="orientation"></div>
  <div id="loader">Loading ...</div>

  <!-- Every library below is the same file the GameMonetize host served, pulled
       into assets/lib/ beside this page; the `<base>`/absolute CDN URLs are gone.
       The published page also loaded the Google IMA ad SDK and the GameMonetize
       SDK from jsDelivr - the game only listens for the SDK's
       `SDK_GAME_START`/`SDK_GAME_PAUSE` events, so with no SDK those never fire
       and nothing is missed. -->
  <script type="text/javascript" src="assets/lib/nape.min.js">
    var nape = "nape.min.js";
  </script>
  <script type="text/javascript" src="assets/lib/jquery-3.1.1.min.js"></script>
  <script type="text/javascript" src="assets/lib/easeljs-0.8.2.combined.js"></script>
  <script type="text/javascript" src="assets/lib/bluebird.min.js"></script>
  <script type="text/javascript" src="assets/lib/phaser.min.js"></script>
  <script type="text/javascript" src="assets/lib/phaser-cachebuster.min.js"></script>
  <script type="text/javascript" src="assets/lib/phaser-super-storage.min.js"></script>
  <script type="text/javascript" src="assets/lib/dragonBones.min.js"></script>
  <script type="text/javascript" src="min.js"></script>
</body>
</html>
