<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slope 3</title>

  <link rel="stylesheet" href="style/style.css">

  <!-- The save. Slope 3 is a Unity WebGL build (2019.4.24f1), so its save is
       the player's own IDBFS tree, one file per PlayerPrefs value, and the two
       edits that matter are in the glue beside this page (see STORAGE.md
       section 6). This has to load before the player: it reads PlayerPrefs as it
       boots, so PluStore must exist before UnityLoader.instantiate runs. -->
  <script src="../../js/plustore.js"></script>
  <script>
    PluStore.configure({ game: 'slope-3' });
  </script>

  <!-- Nothing on this page may leave the machine, and this player carries its
       own telemetry (the Unity cloud endpoints baked into the wasm). A refused
       request must be *answered*, never broken: a failed UnityWebRequest can
       throw inside managed main(), which aborts the whole runtime, and a blocked
       POST that keeps its method fails again because a blob URL cannot be posted
       to. So every refusal is an empty 200 - via fetch, via XHR rewritten to GET,
       and via sendBeacon - which is what an offline machine looks like. See
       STORAGE.md section 6.7. -->
  <script>
    (function () {
      var here = location.protocol + '//' + location.host;
      var refused = [];
      window.pluRefused = refused;

      function allowed(url) {
        try {
          var u = new URL(url, here);
          if (u.protocol === 'data:' || u.protocol === 'blob:') return true;
          return u.protocol + '//' + u.host === here;
        } catch (e) {
          return false;
        }
      }
      function refuse(url) {
        if (refused.indexOf(url) < 0) {
          refused.push(url);
          console.warn('Slope 3: refused a request outside this folder: ' + url);
        }
      }

      var realFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (allowed(url)) return realFetch.apply(this, arguments);
        refuse(url);
        /* An answer, not a rejection: an empty body the caller can read. */
        return Promise.resolve(new Response(new Blob([], { type: 'application/octet-stream' }), { status: 200 }));
      };

      var open = XMLHttpRequest.prototype.open;
      var send = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (method, url) {
        if (allowed(url)) return open.apply(this, arguments);
        refuse(url);
        /* GET, not the caller's method: a blob URL is readable, not postable. */
        this.pluBlocked = URL.createObjectURL(new Blob([], { type: 'application/octet-stream' }));
        return open.apply(this, ['GET', this.pluBlocked].concat(Array.prototype.slice.call(arguments, 2)));
      };
      XMLHttpRequest.prototype.send = function () {
        if (this.pluBlocked) return send.call(this); /* no body is forwarded */
        return send.apply(this, arguments);
      };

      var beacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
      if (beacon) {
        navigator.sendBeacon = function (url, data) {
          if (allowed(url)) return beacon(url, data);
          refuse(url);
          return true;
        };
      }
    })();
  </script>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer" style="width: 100%; height: 95%; margin: auto;"></div>
    <div class="footer">
    </div>
  </div>

  <!-- The game's own callbacks, unchanged from the export. -->
  <script>
    function UnityCallJs() { console.log("unity call!"); }
    function UnityCallPlayJs() { console.log("untiy call Play game"); }
    function UnityCallLeaderboardJs() { console.log("untiy call On Leaderboard"); }
    function UnityCallAgainJs() { console.log("unity call Again"); }
    function UnityCallEndgameJs() { console.log("untiy call end game"); }
    function UnityCallBackHomeJs() { console.log("untiy call backHome"); }
    function UnityCallChangeDayLeaderboardJs() { console.log("untiy call change day leaderboard"); }
    function UnityCallCloseLeaderboardJs() { console.log("untiy call close leaderboard"); }
  </script>

  <!-- The loader and the player glue are the pinned jsDelivr copies
       (bubbls/UGS-Assets commit 9cf4332, the `slope 3/` folder), pulled local and
       verified by git blob hash. The split `Slope3.data.unityweb.part1/part2`
       were merged back into one `Slope3.data.unityweb` beside this page, so the
       page's runtime file-merger shim and its `<base href>` at jsDelivr are both
       gone; the old `js/sync.js` is gone too. `Slope3.wasm.framework.unityweb`
       carries the two PluStore edits of STORAGE.md section 6.3. -->
  <script src="UnityLoader.js"></script>
  <script src="UnityProgress.js"></script>

  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "build.json", {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function () {
          UnityProgress(gameInstance, "complete")
        }
      }
    });
  </script>
</body>
</html>
