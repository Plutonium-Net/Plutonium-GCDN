<!DOCTYPE html>
<!-- Pluto Game 9/11/2026 -->
<html lang="en">

<head>
  <script src="../../js/plustore.js"></script>
  <script>PluStore.configure({ game: 'crazy-cattle-3d', mount: '/userfs' });</script>
  <meta charset="utf-8">
  <script>
    /* The game carries its own score board: it POSTs the player's run to
       crazycattle3d.io/api/highscores and asks the same host for an update,
       both from inside the compiled engine, so the URL is in index.wasm and
       not anywhere in this page. Refused here so that a local build neither
       reports the player off-machine nor sits waiting on a request that
       cannot succeed - the "Update fail!" line in Options is exactly that
       wait ending. A refused request looks like any other failed request to
       the engine, which is what an offline player saw anyway. */
    (function () {
      var BLOCK = /(^|\.)crazycattle3d\.io$/;
      function blocked(url) {
        try { return BLOCK.test(new URL(String(url), location.href).hostname); }
        catch (e) { return false; }
      }
      var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (method, url) {
        this.pluBlocked = blocked(url);
        return open.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function () {
        if (this.pluBlocked) { try { this.abort(); } catch (e) {} return; }
        return send.apply(this, arguments);
      };
      if (window.fetch) {
        var realFetch = window.fetch;
        window.fetch = function (input) {
          var url = typeof input === 'string' ? input : (input && input.url);
          if (blocked(url)) return Promise.reject(new TypeError('blocked: ' + url));
          return realFetch.apply(this, arguments);
        };
      }
      if (navigator.sendBeacon) {
        var beacon = navigator.sendBeacon.bind(navigator);
        navigator.sendBeacon = function (url, data) {
          return blocked(url) ? false : beacon(url, data);
        };
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <title>CrazyCattle3D</title>
  <style>
    html,
    body,
    #canvas {
      margin: 0;
      padding: 0;
      border: 0;
    }

    body {
      color: white;
      background-color: black;
      overflow: hidden;
      touch-action: none;
    }

    #canvas {
      display: block;
    }

    #canvas:focus {
      outline: none;
    }

    #status,
    #status-splash,
    #status-progress {
      position: absolute;
      left: 0;
      right: 0;
    }

    #status,
    #status-splash {
      top: 0;
      bottom: 0;
    }

    #status {
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      visibility: hidden;
    }

    #status-splash {
      max-height: 100%;
      max-width: 100%;
      margin: auto;
    }

    #status-splash.show-image--false {
      display: none;
    }

    #status-splash.fullsize--true {
      height: 100%;
      width: 100%;
      object-fit: contain;
    }

    #status-splash.use-filter--false {
      image-rendering: pixelated;
    }

    #status-progress,
    #status-notice {
      display: none;
    }

    #status-progress {
      bottom: 10%;
      width: 50%;
      margin: 0 auto;
    }

    #status-notice {
      background-color: #5b3943;
      border-radius: 0.5rem;
      border: 1px solid #9b3943;
      color: #e0e0e0;
      font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
      line-height: 1.3;
      margin: 0 2rem;
      overflow: hidden;
      padding: 1rem;
      text-align: center;
      z-index: 1;
    }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
  <!-- The icon and the splash image pointed at the CDN folder this game was
       proxied from, and the apple-touch-icon named a file that folder never
       had, so it 404'd on every load. Both now read the copies beside this
       page; the touch icon is gone rather than pointed at something that is
       not an icon. -->
</head>

<body>
  <canvas id="canvas">
    Your browser does not support the canvas tag.
  </canvas>

  <noscript>
    Your browser does not support JavaScript.
  </noscript>

  <div id="status">
    <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
    <progress id="status-progress"></progress>
    <div id="status-notice"></div>
  </div>

  <!-- index.pck and index.wasm used to come from that same jsDelivr folder,
       three parts each, merged at load time by this page's own fetch override.
       The folder is over jsDelivr's package limit and refuses every file in it
       now, so the game could not start at all. Both files are whole beside
       this page — which is what a Godot export expects — and the merge and the
       override are gone with them. -->

  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {
      "args": [],
      "canvasResizePolicy": 2,
      "ensureCrossOriginIsolationHeaders": false,
      "executable": "index",
      "experimentalVK": false,
      "fileSizes": {
        "index.pck": 42336176,
        "index.wasm": 43699190
      },
      "focusCanvas": true,
      "gdextensionLibs": []
    };
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);

    (function() {
      const statusOverlay = document.getElementById('status');
      const statusProgress = document.getElementById('status-progress');
      const statusNotice = document.getElementById('status-notice');

      let initializing = true;
      let statusMode = '';

      function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
          return;
        }
        if (mode === 'hidden') {
          statusOverlay.remove();
          initializing = false;
          return;
        }
        statusOverlay.style.visibility = 'visible';
        statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
        statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
        statusMode = mode;
      }

      function setStatusNotice(text) {
        while (statusNotice.lastChild) {
          statusNotice.removeChild(statusNotice.lastChild);
        }
        const lines = text.split('\n');
        lines.forEach((line) => {
          statusNotice.appendChild(document.createTextNode(line));
          statusNotice.appendChild(document.createElement('br'));
        });
      }

      function displayFailureNotice(err) {
        console.error(err);
        if (err instanceof Error) {
          setStatusNotice(err.message);
        } else if (typeof err === 'string') {
          setStatusNotice(err);
        } else {
          setStatusNotice('An unknown error occurred.');
        }
        setStatusMode('notice');
        initializing = false;
      }

      const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED,
      });

      if (missing.length !== 0) {
        const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
        displayFailureNotice(missingMsg + missing.join('\n'));
      } else {
        setStatusMode('progress');
        engine.startGame({
          'onProgress': function(current, total) {
            if (current > 0 && total > 0) {
              statusProgress.value = current;
              statusProgress.max = total;
            } else {
              statusProgress.removeAttribute('value');
              statusProgress.removeAttribute('max');
            }
          },
        }).then(() => {
          setStatusMode('hidden');
        }, displayFailureNotice);
      }
    }());
  </script>
</body>

</html>
