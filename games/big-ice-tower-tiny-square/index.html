<!-- The export shipped a second, empty canvas here, positioned over the game's own
	     canvas (#c2canvas, the WebGL surface the runtime actually draws into). Being
	     absolutely positioned it painted on top of it, so every click landed on this
	     dead element and the menu never saw input. It stays for whatever the export
	     expected of it, but no longer takes the pointer. -->

<script src="2min.js"></script>
<script src="runtimee.js"></script>
<script>
		jQuery(document).ready(function ()
		{			
			cr_createRuntime("c2canvas");
		});
		
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		/* The export registered a service worker to cache itself for offline play.
		   This copy is already local, and a cache that outlives an edit is a lie, so
		   the registration is gone: the runtime calls window.C2_RegisterSW only if
		   it exists. */
    </script>
