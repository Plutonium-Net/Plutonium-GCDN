<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Learn to Fly</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #flash-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      overflow: hidden;
    }
    .black-box {
      position: fixed;
      background: black;
      z-index: 10;
    }
    #box-top    { top: 0;    left: 0;  width: 100%; height: 0; }
    #box-bottom { bottom: 0; left: 0;  width: 100%; height: 0; }
    #box-left   { top: 0;    left: 0;  width: 0;    height: 100%; }
    #box-right  { top: 0;    right: 0; width: 0;    height: 100%; }
    ruffle-player {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>

  <script src="../../js/plustore.js"></script>
  <script>
    PluStore.configure({ game: 'learn-to-fly' });
    var storage = PluStore.installSharedObjects('learn-to-fly.swf');
    if (!storage) {
      console.error('Learn to Fly: window.localStorage could not be swapped - ' +
        'the save would go to the browser store instead of the document');
    }

    (function () {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      var here = location.protocol + '//' + location.host;
      var refused = [];

      function local(url) {
        try {
          var u = new URL(url, here);
          if (u.protocol === 'data:' || u.protocol === 'blob:') return true;
          return u.protocol + '//' + u.host === here;
        } catch (e) {
          return false;
        }
      }

      var realFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (local(url)) return realFetch.apply(this, arguments);
        if (refused.indexOf(url) < 0) {
          refused.push(url);
          console.warn('Learn to Fly: refused a request outside this folder: ' + url);
        }
        return Promise.reject(new TypeError('Learn to Fly: only this folder is reachable (' + url + ')'));
      };
    })();
  </script>

  <script src="ruffle/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <div class="black-box" id="box-top"></div>
  <div class="black-box" id="box-bottom"></div>
  <div class="black-box" id="box-left"></div>
  <div class="black-box" id="box-right"></div>
  <script>
    const container = document.getElementById('flash-container');
    const boxTop = document.getElementById('box-top');
    const boxBottom = document.getElementById('box-bottom');
    const boxLeft = document.getElementById('box-left');
    const boxRight = document.getElementById('box-right');

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspectRatio = 5.5 / 3;

      let width = Math.floor(windowWidth * 1);
      let height = Math.floor(width / aspectRatio);

      if (height > windowHeight * 1) {
        height = Math.floor(windowHeight * 1);
        width = Math.floor(height * aspectRatio);
      }

      container.style.width = `${width}px`;
      container.style.height = `${height}px`;

      const topMargin = (windowHeight - height) / 2;
      const leftMargin = (windowWidth - width) / 2;

      boxTop.style.height = `${topMargin}px`;
      boxBottom.style.height = `${topMargin}px`;
      boxLeft.style.width = `${leftMargin}px`;
      boxRight.style.width = `${leftMargin}px`;
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('DOMContentLoaded', () => {
      resizeGame();
      const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
      if (ruffle && container) {
        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.background = 'black';
        container.appendChild(player);
        player.load(new URL('learn-to-fly.swf', location.href).href);
      } else {
        container.textContent = 'Ruffle failed to load.';
      }
    });
  </script>
</body>
</html>
