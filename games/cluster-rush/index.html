    <script>
    /* The build carries Unity's own telemetry: it POSTs hardware stats to
       stats.unity3d.com and talks to Unity Cloud Analytics (config.uca and
       api.uca). Both are made from inside the compiled player, so they cannot
       be removed without editing the heap image — they are refused here
       instead. The player treats a failed request as a failed request, which is
       what an offline player saw anyway. */
    (function () {
      var BLOCK = /(^|\.)unity3d\.com$/;
      function blocked(url) {
        try { return BLOCK.test(new URL(String(url), location.href).hostname); }
        catch (e) { return false; }
      }
      var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (method, url) {
        this.pluBlocked = blocked(url);
        return open.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function () {
        if (this.pluBlocked) { try { this.abort(); } catch (e) {} return; }
        return send.apply(this, arguments);
      };
      if (window.fetch) {
        var realFetch = window.fetch;
        window.fetch = function (input) {
          var url = typeof input === 'string' ? input : (input && input.url);
          if (blocked(url)) return Promise.reject(new TypeError('blocked: ' + url));
          return realFetch.apply(this, arguments);
        };
      }
      if (navigator.sendBeacon) {
        var beacon = navigator.sendBeacon.bind(navigator);
        navigator.sendBeacon = function (url, data) {
          return blocked(url) ? false : beacon(url, data);
        };
      }
    })();
    </script>
