<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backrooms 3D</title>
  <!-- Pluto Game 9/11/2026 -->
  <link rel="stylesheet" href="TemplateData/style.css" />
  <script src="../../js/plustore.js"></script>
  <script>PluStore.configure({ game: 'backrooms-3d' });</script>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .webgl-content {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      margin: 0;
      border: 0;
      position: relative;
      background: url("Build/WebGL.jpg") center center / cover no-repeat;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>

  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "Build/WebGL.json",
      { onProgress: UnityProgress }
    );
  </script>
</body>
</html>
