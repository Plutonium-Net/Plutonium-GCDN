  <!-- The save. This is a GameMaker HTML5 build of the GameMaker Studio 1.4
       generation, so the game has no filesystem of its own: every local file is
       one localStorage entry, written and read by three functions in tf.js, and
       PluStore.files is the whole save (STORAGE.md sections 7 and 7.6).

       filePrefix is this export's own storage prefix, read out of the runner:
       the sanitised product name ("Tiny Fishing" -> "TinyFishing"), a dot, the
       major version field (_Co._Lo, 0) and another dot. Naming it is what keeps
       the document keyed by the file names the game itself uses.

       Nothing has to be in place before the runner starts - a read is just a
       function call - but the prefix does, so this goes ahead of tf.js. -->
  <script src="../../js/plustore.js"></script>
  <script>
    PluStore.configure({ game: 'tiny-fishing', filePrefix: 'TinyFishing.0.' });

    /* The guard. This export was published as a Khan Academy GameSnacks game
       through an editmysite preview host, and its wrapper rewrote every URL on
       its way out through a blob table: a script, an image, an audio file, a
       fetch, an XHR. That rewriting is gone with the zip it came from, so what
       replaces it is a refusal on the same set of surfaces. It is also five
       different surfaces here rather than Ruffle's one, because tf.js is a DOM
       client about as much as a fetch client.

       The build carries three groups of off-machine URL strings it never needs
       locally - an ad integration (jsd.supersonicads.com, a248.e.akamai.net), a
       share/redirect set (dunkbrush.buyhtml5.com, twitter, valve) and a help
       link - so this is not belt and braces the way it is for a movie with no
       URLs in it. Nothing here may leave the machine, whatever future edit makes
       one of them reachable. */
    (function () {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      var here = location.protocol + '//' + location.host;
      var refused = [];

      function local(url) {
        try {
          var u = new URL(url, here);
          if (u.protocol === 'data:' || u.protocol === 'blob:') return true;
          return u.protocol + '//' + u.host === here;
        } catch (e) {
          return false;
        }
      }

      function refuse(what, url) {
        var key = what + ' ' + url;
        if (refused.indexOf(key) < 0) {
          refused.push(key);
          console.warn('Tiny Fishing: refused ' + what + ' outside this folder: ' + url);
        }
        /* Answered, not left hanging: the same-origin spelling of the path, which
           this folder does not have either. The runner's own XHR paths are
           wrapped in try/catch and treat a failure as "no such file". */
        try {
          return location.origin + new URL(url, here).pathname;
        } catch (e) {
          return here + '/';
        }
      }

      var realFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (local(url)) return realFetch.apply(this, arguments);
        return Promise.reject(new TypeError('Tiny Fishing: only this folder is reachable (' + refuse('fetch', url) + ')'));
      };

      var realOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        var rest = [].slice.call(arguments, 2);
        if (!local(url)) url = refuse('request', url);
        return realOpen.apply(this, [method, url].concat(rest));
      };

      /* The element surfaces. The runner sets these from strings it builds
         itself, which is exactly how the preview host's files used to arrive. */
      function guardURL(proto, prop, what) {
        var desc = Object.getOwnPropertyDescriptor(proto, prop);
        if (!desc || !desc.set) return;
        Object.defineProperty(proto, prop, {
          configurable: true,
          enumerable: desc.enumerable,
          get: desc.get,
          set: function (value) {
            if (typeof value === 'string' && !local(value)) value = refuse(what, value);
            return desc.set.call(this, value);
          },
        });
      }
      guardURL(HTMLScriptElement.prototype, 'src', 'script');
      guardURL(HTMLLinkElement.prototype, 'href', 'stylesheet');
      guardURL(HTMLImageElement.prototype, 'src', 'image');
      guardURL(HTMLMediaElement.prototype, 'src', 'audio');
    })();
  </script>
</head>

<body dir="ltr" style="overflow: hidden;">

    /* Still here because the runner checks for it, and it is one line: this
       build's ES5 shims assume the browser has it. */

  <!-- The export, every file of it, in the order its own loader loaded them from
       khanacademy.org. (The runner loads them a second time itself, from this
       folder, because the build declares them as extensions - yph_djl.js is the
       one of the nine with an edit in it: an unguarded dereference of a loading
       screen element this page does not have. See the note in that file.) Upstream those nine URLs were only names: an inline zip
       held the real files and a blob table swapped them in by file name, which
       is why the game ran at all with its host answering for none of them. The
       zip is extracted into this folder now and the blob table is gone, so these
       are the files themselves.

       tf.js is the runner and the game; the other eight are the extensions the
       GML calls into: game snippets (GAMESNACKS), cookies (document.cookie),
       canvas scaling and browser queries, fullscreen, the ZenExternal probes,
       the loading screen, dynamic JS, and the GameSnacks score/audio bridge. -->
  <script src="gamesnacks.js"></script>
  <script src="tf.js"></script>
  <script src="tph_cookieManager.js"></script>
  <script src="uph_HTML5Func.js"></script>
  <script src="vph_API_Fullscreen.js"></script>
  <script src="wph_external.js"></script>
  <script src="yph_djl.js"></script>
  <script src="bqh_djs.js"></script>
  <script src="dqh_gamesnacks.js"></script>
  <script>
    /* The runner defines GameMaker_Init and wires nothing to window.onload, so
       the page starts it - the same call the loader made after its nine loads. */
    GameMaker_Init();
  </script>
